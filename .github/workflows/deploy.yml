name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site (Qwik City SSG)
        run: npm run build
        env:
          # Project sites are served from https://<owner>.github.io/<repo>/
          # (set PUBLIC_BASE_PATH to "/" if you attach a custom domain)
          PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/
          PUBLIC_SITE_ORIGIN: https://${{ github.repository_owner }}.github.io

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          # With a base path, the SSG nests the whole site under dist/<repo>/
          path: dist/${{ github.event.repository.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
