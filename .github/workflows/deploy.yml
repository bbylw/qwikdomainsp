name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site (Qwik City SSG)
        run: npm run build
        env:
          # Project sites are served from https://<owner>.github.io/<repo>/
          # (set PUBLIC_BASE_PATH to "/" if you attach a custom domain)
          PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/
          # Repo variable PAGES_ORIGIN overrides this when the account serves Pages
          # from a custom domain instead of <owner>.github.io
          PUBLIC_SITE_ORIGIN: ${{ vars.PAGES_ORIGIN || format('https://{0}.github.io', github.repository_owner) }}

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
